<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- دائرة الخلفية -->
  <circle cx="100" cy="100" r="90" fill="#1e88e5" />
  
  <!-- الحرف Z باللغة العربية (زاي) -->
  <path d="M75 60 L125 60 L75 140 L125 140" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- دائرة داخلية تمثل الذرة (رمز للعلوم) -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#ffffff" stroke-width="5" />
  
  <!-- مدارات الذرة -->
  <ellipse cx="100" cy="100" rx="50" ry="15" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(30 100 100)" />
  <ellipse cx="100" cy="100" rx="50" ry="15" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(90 100 100)" />
  <ellipse cx="100" cy="100" rx="50" ry="15" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(150 100 100)" />
  
  <!-- نص أكاديمية زويل -->
  <text x="100" y="180" font-family="Cairo, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">أكاديمية زويل</text>
</svg>